# Default theme. Users can toggle Light/Dark from the hamburger menu (Settings).
[theme]
base = "dark"
primaryColor = "#E8B7A8"
backgroundColor = "#1B1A1F"
secondaryBackgroundColor = "#232229"
textColor = "#EFE9E2"
font = "sans serif"

[server]
headless = true
runOnSave = false
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
